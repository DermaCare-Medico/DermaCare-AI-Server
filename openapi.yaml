                - bodyPart
                - durationDays
              properties:
                imageUrl:
                  type: string
                  format: uri
                  description: Private secure image URL or upload key
                  example: https://storage.dermacare.ai/raw-screenings/img_4810a.jpg
                bodyPart:
                  type: string
                  enum:
                    - FACE
                    - NECK
                    - CHEST
                    - BACK
                    - ARM
                    - LEG
                    - HAND
                    - FOOT
                    - TORSO
                    - OTHER
                  example: ARM
                durationDays:
                  type: integer
                  minimum: 1
                  description: Number of days lesion/symptom has been observed
                  example: 14
                symptoms:
                  type: array
                  items:
                    type: string
                  example:
                    - itching
                    - redness
                    - dryness
                itchinessSeverity:
                  type: integer
                  minimum: 1
                  maximum: 10
                  description: Patient-rated itch severity (1-10)
                  example: 6
                hasBleeding:
                  type: boolean
                  description: Indicates lesion bleeding (red flag trigger)
                  example: false
            example:
              imageUrl: https://storage.dermacare.ai/raw-screenings/img_4810a.jpg
              bodyPart: ARM
              durationDays: 14
              symptoms:
                - itching
                - redness
                - dryness
              itchinessSeverity: 6
              hasBleeding: false
