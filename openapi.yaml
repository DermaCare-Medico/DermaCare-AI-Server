paths:
  /auth/register:
    post:
      operationId: post__auth_register_1
      summary: Register patient or doctor and start OTP verification
      description: >-
        Registers a new user account with role Patient or Doctor. Generates a
        secure time-limited OTP sent to the supplied email for identity
        activation.


        **Healthcare & Business Constraints:**

        - Account begins in PENDING_VERIFICATION status.

        - Generates a 6-digit cryptographic OTP valid for 10 minutes.

        - Doctor accounts require subsequent medical license submission via POST
        /doctors/me/license.


        *Contract Status:* **Specified but not implemented**
      tags:
        - Authentication
      requestBody:
        description: Registration credentials and initial user profile data.
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
                - role
                - name
              properties:
                email:
                  type: string
                  format: email
                  description: Unique user email address
                  example: patient.jane@example.com
                password:
                  type: string
                  format: password
                  description: Strong password with min 8 chars, 1 uppercase, 1 symbol
                  example: SecureDermal#2026
                role:
                  type: string
                  enum:
                    - PATIENT
                    - DOCTOR
                  description: Initial account role
                  example: PATIENT
                name:
                  type: string
                  description: Full legal name
                  example: Jane Doe
                phoneNumber:
                  type: string
                  description: Optional contact phone number
                  example: +1-555-019-2834
            example:
              email: patient.jane@example.com
              password: SecureDermal#2026
              role: PATIENT
              name: Jane Doe
              phoneNumber: +1-555-019-2834
      responses:
        "201":
          description: Account created successfully; OTP dispatched to email.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
              example:
                success: true
                message: Verification code sent to patient.jane@example.com
                data:
                  userId: usr_9f8e7d6c5b
                  email: patient.jane@example.com
                  role: PATIENT
                  status: PENDING_VERIFICATION
                  expiresIn: 600
        "400":
          description: Validation failed or email already registered.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
              example:
                success: false
                error:
                  code: EMAIL_ALREADY_EXISTS
                  message: An account with this email already exists.
      x-endpoint-id: 1
      x-module-number: "01"
      x-authorized-roles:
        - PUBLIC
      x-implementation-status: Specified but not implemented
      x-business-rules:
        - Account begins in PENDING_VERIFICATION status.
        - Generates a 6-digit cryptographic OTP valid for 10 minutes.
        - Doctor accounts require subsequent medical license submission via POST
          /doctors/me/license.
      x-related-endpoints:
        - 2
        - 3
        - 4
  /auth/verify-otp:
    post:
      operationId: post__auth_verify_otp_2
      summary: Verify email OTP and activate registration
      description: >-
        Validates the submitted 6-digit email OTP. On success, transitions user
        status to ACTIVE and issues initial authentication session tokens.


        **Healthcare & Business Constraints:**

        - Maximum 5 failed attempts allowed before OTP invalidation.

        - Transitions user state from PENDING_VERIFICATION to ACTIVE.

        - Issues short-lived JWT access token (15 mins) and HTTP-only refresh
        token (7 days).


        *Contract Status:* **Specified but not implemented**
      tags:
        - Authentication
      requestBody:
        description: Email and 6-digit OTP code.
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - otp
              properties:
                email:
                  type: string
                  format: email
                  description: Registered email address
                  example: patient.jane@example.com
                otp:
                  type: string
                  description: 6-digit numeric verification code
                  example: "492817"
            example:
              email: patient.jane@example.com
              otp: "492817"
      responses:
        "200":
          description: OTP verified successfully; session tokens issued.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
              example:
                success: true
                message: Account verified and activated.
                data:
                  accessToken: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.exampleAccessToken...
                  expiresIn: 900
                  user:
                    id: usr_9f8e7d6c5b
                    email: patient.jane@example.com
                    role: PATIENT
                    status: ACTIVE
        "400":
          description: Invalid or expired OTP code.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
              example:
                success: false
                error:
                  code: INVALID_OTP
                  message: The provided verification code is incorrect or expired.
      x-endpoint-id: 2
      x-module-number: "01"
      x-authorized-roles:
        - PUBLIC
      x-implementation-status: Specified but not implemented
      x-business-rules:
        - Maximum 5 failed attempts allowed before OTP invalidation.
        - Transitions user state from PENDING_VERIFICATION to ACTIVE.
        - Issues short-lived JWT access token (15 mins) and HTTP-only refresh
          token (7 days).
      x-related-endpoints:
        - 1
        - 3
        - 4
  /auth/resend-otp:
    post:
      operationId: post__auth_resend_otp_3
      summary: Resend rate-limited OTP
      description: >-
        Regenerates and dispatches a new verification OTP to the target email.
        Strictly throttled to prevent spam and abuse.


        **Healthcare & Business Constraints:**

        - Rate-limited: 60-second cooldown between resend requests.

        - Invalidates any previously issued unexpired OTP for this account.


        *Contract Status:* **Specified but not implemented**
      tags:
        - Authentication
      requestBody:
        description: User email and OTP reason.
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
              properties:
                email:
                  type: string
                  format: email
                  description: Target email address
                  example: patient.jane@example.com
                type:
                  type: string
                  enum:
                    - REGISTRATION
                    - PASSWORD_RESET
                  description: OTP purpose
                  example: REGISTRATION
            example:
              email: patient.jane@example.com
              type: REGISTRATION
      responses:
        "200":
          description: New verification OTP generated and dispatched.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
              example:
                success: true
                message: A new verification code has been dispatched.
                data:
                  cooldownSeconds: 60
        "400":
          description: Validation error or invalid request format.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                error:
                  code: INVALID_REQUEST
                  message: The request payload is invalid or malformed.
        "429":
          description: Rate limit exceeded.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
              example:
                success: false
                error:
                  code: RATE_LIMIT_EXCEEDED
                  message: Please wait 45 seconds before requesting another code.
      x-endpoint-id: 3
      x-module-number: "01"
      x-authorized-roles:
        - PUBLIC
      x-implementation-status: Specified but not implemented
      x-business-rules:
        - "Rate-limited: 60-second cooldown between resend requests."
        - Invalidates any previously issued unexpired OTP for this account.
      x-related-endpoints:
        - 1
        - 2
  /auth/login:
    post:
      operationId: post__auth_login_4
      summary: Issue access and refresh credentials
      description: >-
        Authenticates user credentials, validates account status, and issues
        access token and refresh token credentials.


        **Healthcare & Business Constraints:**

        - Rejects login if user status is PENDING_VERIFICATION or SUSPENDED.

        - Access token expires in 15 minutes (900s).

        - Refresh token is delivered via Secure HTTP-Only cookie with
        SameSite=Strict and expires in 7 days.


        *Contract Status:* **Specified but not implemented**
      tags:
        - Authentication
      requestBody:
        description: User login credentials.
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                  description: Account email
                  example: patient.jane@example.com
                password:
                  type: string
                  format: password
                  description: Account password
                  example: SecureDermal#2026
            example:
              email: patient.jane@example.com
              password: SecureDermal#2026
      responses:
        "200":
          description: Authentication successful; credentials issued.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
              example:
                success: true
                data:
                  accessToken: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                  tokenType: Bearer
                  expiresIn: 900
                  user:
                    id: usr_9f8e7d6c5b
                    email: patient.jane@example.com
                    role: PATIENT
                    name: Jane Doe
        "400":
          description: Validation error or invalid request format.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                error:
                  code: INVALID_REQUEST
                  message: The request payload is invalid or malformed.
        "401":
          description: Invalid credentials or inactive account.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
              example:
                success: false
                error:
                  code: INVALID_CREDENTIALS
                  message: Invalid email or password.
      x-endpoint-id: 4
      x-module-number: "01"
      x-authorized-roles:
        - PUBLIC
      x-implementation-status: Specified but not implemented
      x-business-rules:
        - Rejects login if user status is PENDING_VERIFICATION or SUSPENDED.
        - Access token expires in 15 minutes (900s).
        - Refresh token is delivered via Secure HTTP-Only cookie with
          SameSite=Strict and expires in 7 days.
      x-related-endpoints:
        - 5
        - 6
        - 9
  /auth/logout:
    post:
      operationId: post__auth_logout_5
      summary: Revoke refresh session
      description: >-
        Revokes the active refresh token session in the database and clears the
        refresh session cookie.


        **Healthcare & Business Constraints:**

        - Revokes stored refresh token hash in database.

        - Clears HTTP-only refresh session cookie.


        *Contract Status:* **Specified but not implemented**
      tags:
        - Authentication
      responses:
        "200":
          description: Logged out successfully; session invalidated.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
              example:
                success: true
                message: Session revoked successfully.
        "400":
          description: Validation error or invalid request format.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                error:
                  code: INVALID_REQUEST
                  message: The request payload is invalid or malformed.
        "401":
          description: Unauthorized; missing or invalid session token.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
              example:
                success: false
                error:
                  code: UNAUTHORIZED
                  message: Session token is invalid or expired.
        "403":
          description: Forbidden; caller lacks necessary role or ownership authorization.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                error:
                  code: FORBIDDEN
                  message: You do not have permission to perform this action.
      security:
        - BearerAuth: []
        - CookieAuth: []
      x-endpoint-id: 5
      x-module-number: "01"
      x-authorized-roles:
        - PATIENT
        - DOCTOR
        - ADMIN
      x-implementation-status: Specified but not implemented
      x-business-rules:
        - Revokes stored refresh token hash in database.
        - Clears HTTP-only refresh session cookie.
      x-related-endpoints:
        - 4
        - 6
  /auth/refresh-token:
    post:
      operationId: post__auth_refresh_token_6
      summary: Rotate refresh token
      description: >-
        Rotates the refresh token and issues a new access token. Employs refresh
        token reuse detection to guard against token theft.


        **Healthcare & Business Constraints:**

        - Rotates refresh token upon every use.

        - If a previously used refresh token is presented, all user sessions are
        immediately revoked (reuse detection safeguard).


        *Contract Status:* **Specified but not implemented**
      tags:
        - Authentication
      requestBody:
        description: Optional refresh token in body if cookies are not used.
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                refreshToken:
                  type: string
                  description: Refresh token string
                  example: rft_a1b2c3d4e5f6...
            example:
              refreshToken: rft_a1b2c3d4e5f6...
      responses:
        "200":
          description: Tokens rotated successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
              example:
                success: true
                data:
                  accessToken: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                  expiresIn: 900
        "400":
          description: Validation error or invalid request format.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                error:
                  code: INVALID_REQUEST
                  message: The request payload is invalid or malformed.
        "401":
          description: Invalid or revoked refresh token.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
              example:
                success: false
                error:
                  code: INVALID_REFRESH_TOKEN
                  message: Refresh token is expired, revoked, or already reused.
      x-endpoint-id: 6
      x-module-number: "01"
      x-authorized-roles:
        - PUBLIC
      x-implementation-status: Specified but not implemented
      x-business-rules:
        - Rotates refresh token upon every use.
        - If a previously used refresh token is presented, all user sessions are
          immediately revoked (reuse detection safeguard).
      x-related-endpoints:
        - 4
        - 5
  /auth/forgot-password:
    post:
      operationId: post__auth_forgot_password_7
      summary: Initiate password-reset OTP
      description: >-
        Initiates a password recovery request and dispatches a secure reset code
        to the verified user email.


        **Healthcare & Business Constraints:**

        - Rate-limited: 60-second cooldown per account.

        - Returns generic success message regardless of email existence to
        prevent user enumeration attacks.


        *Contract Status:* **Specified but not implemented**
      tags:
        - Authentication
      requestBody:
        description: Target account email.
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
              properties:
                email:
                  type: string
                  format: email
                  description: Registered email address
                  example: patient.jane@example.com
            example:
              email: patient.jane@example.com
      responses:
        "200":
          description: Reset request received. If email exists, OTP was dispatched.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
              example:
                success: true
                message: If the email matches an account, a reset code has been sent.
        "400":
          description: Validation error or invalid request format.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                error:
                  code: INVALID_REQUEST
                  message: The request payload is invalid or malformed.
      x-endpoint-id: 7
      x-module-number: "01"
      x-authorized-roles:
        - PUBLIC
      x-implementation-status: Specified but not implemented
      x-business-rules:
        - "Rate-limited: 60-second cooldown per account."
        - Returns generic success message regardless of email existence to
          prevent user enumeration attacks.
      x-related-endpoints:
        - 8
  /auth/reset-password:
    post:
      operationId: post__auth_reset_password_8
      summary: Verify reset proof and change password
      description: >-
        Verifies the password reset OTP code and updates the account password
        with cryptographic hashing.


        **Healthcare & Business Constraints:**

        - Enforces password complexity rules (minimum 8 characters, numbers,
        uppercase, symbols).

        - Invalidates all active refresh tokens upon successful password reset.


        *Contract Status:* **Specified but not implemented**
      tags:
        - Authentication
      requestBody:
        description: Reset code and new password.
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - otp
                - newPassword
              properties:
                email:
                  type: string
                  format: email
                  description: Account email
                  example: patient.jane@example.com
                otp:
                  type: string
                  description: 6-digit verification code
                  example: "839201"
                newPassword:
                  type: string
                  format: password
                  description: New strong password
                  example: BrandNewSecure#2026
            example:
              email: patient.jane@example.com
              otp: "839201"
              newPassword: BrandNewSecure#2026
      responses:
        "200":
          description: Password reset successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
              example:
                success: true
                message: Password has been successfully updated. Please log in.
        "400":
          description: Invalid OTP or password does not meet criteria.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
              example:
                success: false
                error:
                  code: INVALID_RESET_PROOF
                  message: The verification code is invalid or has expired.
      x-endpoint-id: 8
      x-module-number: "01"
      x-authorized-roles:
        - PUBLIC
      x-implementation-status: Specified but not implemented
      x-business-rules:
        - Enforces password complexity rules (minimum 8 characters, numbers,
          uppercase, symbols).
        - Invalidates all active refresh tokens upon successful password reset.
      x-related-endpoints:
        - 4
        - 7
  /auth/me:
    get:
      operationId: get__auth_me_9
      summary: Return role-aware identity and safe profile summary
      description: >-
        Unifies role-specific profile reads under a single endpoint. Returns
        safe user identity, active role, permissions, and doctor verification
        status if applicable.


        **Healthcare & Business Constraints:**

        - Never returns password hashes or private cryptographic salts.

        - For doctors, includes license verification status (PENDING_REVIEW,
        APPROVED, REJECTED).

        - For patients, includes active subscription tier (FREE, PREMIUM).


        *Contract Status:* **Specified but not implemented**
      tags:
        - Authentication
      responses:
        "200":
          description: Identity and safe profile summary.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
              example:
                success: true
                data:
                  id: usr_9f8e7d6c5b
                  email: patient.jane@example.com
                  role: PATIENT
                  name: Jane Doe
                  phoneNumber: +1-555-019-2834
                  status: ACTIVE
