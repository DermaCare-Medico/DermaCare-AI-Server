    post:
      operationId: post__screenings_13
      summary: Upload private image, symptoms; run screening and safety rules
      description: >-
        Uploads a private clinical photograph and user-reported symptoms.
        Executes the dermatological AI screening model and evaluates mandatory
        clinical safety guardrails.


        **Healthcare & Business Constraints:**

        - Preliminary results only: MUST NOT be presented as a definitive
        clinical diagnosis.

        - Safety Rule: Confidence score below 60% suppresses all natural-care
        and OTC recommendations.

        - Safety Rule: High-risk scores above 20% trigger clinical urgency
        warnings.

        - Safety Rule: Red flags (e.g. rapid bleeding, color variation,
        asymmetry) override all scores and force an emergency consultation
        advisory.

        - Daily quota check: Free users limited to 3 screenings per day; Premium
        users enjoy unlimited screenings.


        *Contract Status:* **Specified but not implemented**
