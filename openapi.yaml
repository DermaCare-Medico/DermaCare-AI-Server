components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: "Short-lived JWT access token issued upon login (15 min validity).
        Header: `Authorization: Bearer <token>`"
    CookieAuth:
      type: apiKey
      in: cookie
      name: refreshToken
      description: HTTP-only Secure cookie storing the refresh token with automatic
        rotation (7 days validity).
  schemas:
    ErrorResponse:
      type: object
      required:
        - success
        - error
      properties:
        success:
          type: boolean
          example: false
        error:
          type: object
          required:
            - code
            - message
          properties:
            code:
              type: string
              example: VALIDATION_ERROR
            message:
              type: string
              example: Detailed error description
    SuccessResponse:
      type: object
      required:
        - success
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Operation completed successfully.
        data:
          type: object
    UserProfile:
      type: object
      properties:
        id:
          type: string
          example: usr_9f8e7d6c5b
        email:
          type: string
          example: patient.jane@example.com
        role:
          type: string
          enum:
            - PATIENT
            - DOCTOR
            - ADMIN
          example: PATIENT
        name:
          type: string
          example: Jane Doe
        status:
          type: string
          enum:
            - ACTIVE
            - PENDING_VERIFICATION
            - SUSPENDED
          example: ACTIVE
    ScreeningSummary:
      type: object
      properties:
        screeningId:
          type: string
          example: scr_9918274a
        bodyPart:
          type: string
          example: ARM
        detectedCondition:
          type: string
          example: Atopic Dermatitis
        confidenceScore:
          type: number
          example: 0.84
        riskLevel:
          type: string
          enum:
            - LOW
            - MODERATE
            - HIGH
          example: LOW
        redFlagDetected:
          type: boolean
          example: false
    AppointmentSummary:
      type: object
      properties:
        appointmentId:
          type: string
          example: apt_55102
        doctorId:
          type: string
          example: doc_44120
        patientId:
          type: string
          example: usr_9f8e7d6c5b
        status:
          type: string
          enum:
            - SCHEDULED
            - IN_PROGRESS
            - COMPLETED
            - CANCELLED
          example: SCHEDULED
        scheduledTime:
          type: string
          format: date-time
          example: 2026-10-15T09:30:00Z
    PrescriptionItem:
      type: object
      required:
        - medicineName
        - dosage
        - frequency
        - durationDays
      properties:
        medicineName:
          type: string
          example: Hydrocortisone 1% Cream
        dosage:
          type: string
          example: Thin layer
        frequency:
          type: string
          example: Twice daily
        durationDays:
          type: integer
          example: 7
        instructions:
          type: string
          example: Apply after cleansing
