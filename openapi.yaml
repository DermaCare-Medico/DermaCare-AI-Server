info:
  title: DermaCare AI API Reference
  version: 1.0.0-proposed
  description: >-
    # DermaCare AI — Optimized MVP REST API Specification


    Welcome to the **DermaCare AI API Developer Documentation Portal**.
    DermaCare AI is a comprehensive, clinical-grade dermatological healthcare
    platform serving **Patients**, **Doctors**, and **Administrators**.


    ### Key Scope & Architecture:

    - **AI Skin Screening**: Image analysis, differential findings, confidence
    calibration, and emergency red-flag safeguards.

    - **Doctor Discovery & Booking**: Verified dermatologists, condition
    matching, atomic 10-minute slot holds, and scheduling.

    - **Telemedicine & Consultations**: Consent-gated clinical records,
    time-limited Jitsi video, and SOAP note authoring.

    - **Prescriptions & Digital Pharmacy**: Immutable prescription versioning,
    generic matching, and Rx-verified ordering.

    - **Post-Consultation Chat**: Secure 7-day text messaging channel between
    patient and treating physician.

    - **Sandbox Financials**: Simulated payments, subscription tiers (Free,
    Patient Premium, Doctor Featured), and order fulfillment.


    ---


    ### Non-Negotiable Healthcare Safety Rules:

    1. **Preliminary AI Advisory**: AI screening results are strictly
    preliminary. Confidence below 60% suppresses OTC recommendations; high-risk
    scores above 20% trigger clinical urgency warnings; red flags override all
    outputs.

    2. **Strict RBAC & Consent**: Never trust client-supplied `role` or
    `userId`. Pre-consultation patient records are accessible ONLY to the booked
    doctor after explicit patient consent.

    3. **Atomic Slot Reservation**: Slot holds last exactly 10 minutes to
    eliminate double-booking.

    4. **Prescription Immutability**: Finalizing a prescription freezes that
    legal version. Amendments create new versions.

    5. **Separation of Sponsored Content**: Advertisements must be labeled
    "Sponsored" and MUST NEVER appear on AI results, emergency alerts,
    consultations, prescriptions, or chats.


    ---

    > **Implementation Status Note:**

    > This portal reflects the **84 proposed REST API endpoints** from the
    official *DermaCare AI Optimized MVP API Specification*. As documented in
    the repository audit, all 84 endpoints are in **Specified (Contract
    Proposed)** status pending backend route implementation.
